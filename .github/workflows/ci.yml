name: CI

# Tüm dallarda çalışır. Yalnızca main'e bakmak, uzun süren özellik
# dallarındaki hataların birleştirme anına kadar gizli kalmasına yol açıyordu.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  depo:
    name: Depo bütünlüğü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Kaynak kodun .gitignore tarafından sessizce silinmediğini doğrular.
      # Bu bir kez yaşandı: sabitlenmemiş "models/" deseni krizkalkan_core/models
      # paketini depodan sildi, testler yerelde geçtiği için fark edilmedi.
      - name: Kaynak dosyalar depoda mı?
        run: python scripts/ci/repo_denetimi.py

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sürüm bilinçli olarak belirtilmiyor: pnpm/action-setup, kök
      # package.json içindeki "packageManager" alanını okur. İkisi birden
      # verilirse ERR_PNPM_BAD_PM_VERSION hatası oluşur.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --parallel lint
      - run: pnpm -r --parallel typecheck
      - run: pnpm --filter @krizkalkan/web build

  python:
    name: Python (API + Worker + Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          # Depoda requirements.txt yok; önbellek anahtarı pyproject
          # dosyalarından türetilir.
          cache-dependency-path: |
            libs/krizkalkan-core/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/krizkalkan-core[dev]"
          pip install -e "apps/api[dev]"
          pip install -e "apps/worker[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Biçim kontrolü (ruff format)
        run: ruff format --check .

      - name: Testler (pytest)
        run: pytest
