name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --parallel lint
      - run: pnpm -r --parallel typecheck
      - run: pnpm --filter @krizkalkan/web build

  python:
    name: Python (API + Worker + Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -e "libs/krizkalkan-core[dev]"
          pip install -e "apps/api[dev]"
          pip install -e "apps/worker[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Biçim kontrolü (ruff format)
        run: ruff format --check .

      - name: Testler (pytest)
        run: pytest
