[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krizkalkan-api"
version = "0.0.1"
description = "KrizKalkan AI — FastAPI ağ geçidi (içerik alımı, analiz sonuçları, moderasyon API'si)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
    "krizkalkan-core",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.17.1",
    "psycopg[binary]>=3.2.12",
    "redis>=6.4.0",
    "celery>=5.6.3",
    "boto3>=1.41.5",
    "python-multipart>=0.0.20",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "httpx2>=2.12.0",  # starlette TestClient artık httpx2 bekliyor
    "ruff>=0.15.2",
    "mypy>=1.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/krizkalkan_api"]
